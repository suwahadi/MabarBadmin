{{define "content"}}
<div class="mx-auto max-w-lg px-4 pt-10">
  <div class="card space-y-4 p-6">
    <h1 class="flex items-center gap-2 text-2xl font-bold">{{icon "repeat"}} Slot sudah dioper</h1>
    <p>Kirim link tiket ini ke <strong>{{.Data.Name}}</strong>. Link ini satu-satunya akses pengganti ke slotnya.</p>
    <p class="break-all rounded-lg bg-surface-2 px-3 py-2 font-mono text-sm">{{.Data.Link}}</p>
    <div class="btn-pair">
      <a href="{{.Data.Back}}" class="btn btn-secondary">Kembali ke sesi</a>
      {{template "copy_button" dict "Text" .Data.Link "Label" "Salin link tiket"}}
    </div>
  </div>
</div>
{{end}}
