{{define "content"}}
<div class="mx-auto max-w-md px-4 pt-10">
  <div class="card space-y-5 p-6">
    <h1 class="text-2xl font-bold">Ganti password</h1>
    {{if .User.MustChangePassword}}<p class="notice notice-warn text-sm">{{icon "triangle-alert"}}Kamu masuk dengan password sementara dari admin. Buat password baru dulu.</p>{{end}}
    <form method="post" action="/me/password" class="grid gap-4">
      {{template "csrf" .CSRF}}
      <div><label class="label" for="cp">Password saat ini</label><input id="cp" class="input" name="current_password" type="password" required autocomplete="current-password"></div>
      <div><label class="label" for="np">Password baru</label><input id="np" class="input" name="new_password" type="password" minlength="8" required autocomplete="new-password"></div>
      <div><label class="label" for="np2">Ulangi password baru</label><input id="np2" class="input" name="new_password_confirm" type="password" minlength="8" required autocomplete="new-password"></div>
      <button class="btn btn-primary btn-lg">Simpan password</button>
    </form>
  </div>
</div>
{{end}}
